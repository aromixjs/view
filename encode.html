<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
   <div id="root"></div>
    <script>
      const RESERVED = [
        ..."{}()[]<>\"'`:;/\\%$#@=!&|?*+-,.",
        "\t",
        "\n",
        "\v",
        "\f",
        "\r",
        " ",
        "\u0085",
        "\u00A0",
        "\u1680",
        "\u2000",
        "\u2001",
        "\u2002",
        "\u2003",
        "\u2004",
        "\u2005",
        "\u2006",
        "\u2007",
        "\u2008",
        "\u2009",
        "\u200A",
        "\u2028",
        "\u2029",
        "\u202F",
        "\u205F",
        "\u3000",
      ];

      const BASE = 0xe000; // Private Use Area start
      const END = BASE + RESERVED.length; // exclusive

       function encode(value) {
        let out = "";
        for (const ch of value) {
          const cp = ch.codePointAt(0);
          if (cp >= BASE && cp < END) {
            throw new Error(
              `encode: input contains reserved sentinel U+${cp.toString(16)}`,
            );
          }
          const i = RESERVED.indexOf(ch);
          out += i === -1 ? ch : String.fromCodePoint(BASE + i);
        }
        return out;
      }

       function decode(value) {
        let out = "";
        for (const ch of value) {
          const cp = ch.codePointAt(0);
          out += cp >= BASE && cp < END ? RESERVED[cp - BASE] : ch;
        }
        return out;
      }

      const data = encode(
        JSON.stringify({
          data: 123,
          datas: "sta> :[]",
        }),
      );



document.getElementById('root').setAttribute('liz',data)

    </script>
  </body>
</html>
